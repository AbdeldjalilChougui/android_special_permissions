name: android_special_permissions
description: One Android API for special-access permissions (usage access, overlay, accessibility, notification listener, exact alarms, roles) with status checks and Settings deep links.
version: 0.1.0
homepage: https://abdeldjalilchougui.biz/
repository: https://github.com/AbdeldjalilChougui/android_special_permissions
issue_tracker: https://github.com/AbdeldjalilChougui/android_special_permissions/issues
topics:
  - permissions
  - android
  - settings
  - accessibility
  - plugin

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.abdeldjalilchougui.android_special_permissions
        pluginClass: AndroidSpecialPermissionsPlugin
